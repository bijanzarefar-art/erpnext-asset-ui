# نمونه nginx برای Asset UI — این فایل در پروژه نگه داشته می‌شود و اجرا نمی‌شود.
#
# معماری: رابط Vue و Frappe روی یک دامنه (هم‌مبدأ) سرو می‌شوند؛ بنابراین کوکی sid
# بدون CORS کار می‌کند و هیچ allow_cors در site_config لازم نیست.
#
#   https://assets.example.com/asset-ui/   ->  فایل‌های ایستای asset-ui/dist
#   https://assets.example.com/api/...     ->  gunicorn (Frappe)
#   https://assets.example.com/socket.io   ->  سرور socketio
#   بقیه مسیرها (Desk، /files، /assets)    ->  مثل پیکربندی استاندارد bench
#
# پیش‌نیازها:
#   1. فرانت با پایه /asset-ui/ ساخته شود:   cd asset-ui && npm run build:deploy
#   2. مقادیر زیر را جایگزین کنید:
#        assets.example.com        نام دامنه (باید با نام سایت Frappe یکی باشد، یا Host را ثابت کنید)
#        /opt/bench                مسیر frappe-bench
#        /opt/asset-ui/dist        مسیر خروجی build
#        127.0.0.1:8000 / 9000     پورت gunicorn و socketio (webserver_port و socketio_port)
#   3. gunicorn باید X-Forwarded-Proto را از nginx بپذیرد تا Frappe کوکی sid را Secure بفرستد.
#      پیش‌فرض gunicorn (forwarded_allow_ips=127.0.0.1) وقتی nginx روی همان ماشین است کافی است.

# پیش‌نیاز: فایل deploy/nginx/asset-ui-security-headers.conf در /etc/nginx/snippets/ کپی شود.

upstream asset_frappe {
	server 127.0.0.1:8000 fail_timeout=0;
}

upstream asset_socketio {
	server 127.0.0.1:9000 fail_timeout=0;
}

# درخواست با Host ناشناخته رد شود
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;
	ssl_reject_handshake on;
	return 444;
}

server {
	listen 80;
	listen [::]:80;
	server_name assets.example.com;
	# مسیر چالش Let's Encrypt (certbot --webroot -w /var/www/certbot) قبل از ریدایرکت
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}
	location / {
		return 301 https://assets.example.com$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name assets.example.com;

	ssl_certificate     /etc/letsencrypt/live/assets.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/assets.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;

	# root برای /assets و /files خود Frappe (همان رفتار bench)
	root /opt/bench/sites;

	client_max_body_size 50m;
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;

	# هدرهای امنیتی در یک فایل جدا؛ هر location که add_header خودش را دارد باید دوباره include کند،
	# چون nginx در آن صورت add_headerهای سطح server را به ارث نمی‌دهد.
	include /etc/nginx/snippets/asset-ui-security-headers.conf;

	# application/json فشرده نمی‌شود: پاسخ session.me توکن CSRF دارد (BREACH).
	gzip on;
	gzip_types text/css application/javascript image/svg+xml;

	# ---- Asset UI (SPA) ----
	location = /asset-ui {
		return 301 /asset-ui/;
	}

	# فایل‌های hash‌دار Vite: کش طولانی
	location ^~ /asset-ui/assets/ {
		alias /opt/asset-ui/dist/assets/;
		include /etc/nginx/snippets/asset-ui-security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# بقیه مسیرها به index.html برمی‌گردند (history mode در vue-router).
	# با alias، مقدار try_files باید مسیر فایل واقعی باشد، نه مسیر URL؛
	# وگرنه صفحه‌های داخل برنامه (مثل /asset-ui/asset-list) 404 می‌دهند.
	location ^~ /asset-ui/ {
		alias /opt/asset-ui/dist/;
		try_files $uri $uri/ /opt/asset-ui/dist/index.html;
		include /etc/nginx/snippets/asset-ui-security-headers.conf;
		add_header Cache-Control "no-cache" always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
	}

	# ---- Frappe ----
	location /assets {
		include /etc/nginx/snippets/asset-ui-security-headers.conf;
		add_header Cache-Control "max-age=31536000" always;
		try_files $uri =404;
	}

	location ~ ^/protected/(.*) {
		internal;
		try_files /assets.example.com/$1 =404;
	}

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name assets.example.com;
		proxy_set_header Host $host;
		proxy_pass http://asset_socketio;
	}

	location / {
		# فایل‌های قابل اجرا در مرورگر از /files به‌صورت دانلود داده شوند
		# همان فهرست FORCE_DOWNLOAD_EXTENSIONS در frappe/utils/response.py
		location ~* ^/files/.*\.(svgz?|html?|xht(ml)?|shtml?|mht(ml)?|xml|xslt?|swf)$ {
			include /etc/nginx/snippets/asset-ui-security-headers.conf;
			add_header Content-Disposition "attachment" always;
			add_header Content-Security-Policy "sandbox" always;
			default_type application/octet-stream;
			types { }
			try_files /assets.example.com/public/$uri @frappe;
		}
		try_files /assets.example.com/public/$uri @frappe;
	}

	location @frappe {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Frappe-Site-Name assets.example.com;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;
		proxy_pass http://asset_frappe;
	}
}
