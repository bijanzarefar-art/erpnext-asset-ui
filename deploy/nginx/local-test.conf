# Local test copy of deploy/nginx/asset-ui.conf.
# It follows the sample's locations but uses real paths on this machine and plain
# HTTP on 8090, so it can be checked without certificates. Not for production.

upstream asset_frappe_local {
	server 127.0.0.1:8002 fail_timeout=0;
}

server {
	listen 8090 default_server;
	server_name asset.localhost;
	if ($host != asset.localhost) { return 444; }

	root /Users/bijanzarefar/ERPNEXT-PROJECT/frappe-bench/sites;

	include /Users/bijanzarefar/ERPNEXT-PROJECT/deploy/nginx/asset-ui-security-headers.conf;

	client_max_body_size 50m;
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;

	gzip on;
	gzip_types text/css application/javascript image/svg+xml;

	location = /asset-ui {
		return 301 /asset-ui/;
	}

	location ^~ /asset-ui/assets/ {
		alias /Users/bijanzarefar/ERPNEXT-PROJECT/asset-ui/dist/assets/;
		include /Users/bijanzarefar/ERPNEXT-PROJECT/deploy/nginx/asset-ui-security-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	location ^~ /asset-ui/ {
		alias /Users/bijanzarefar/ERPNEXT-PROJECT/asset-ui/dist/;
		include /Users/bijanzarefar/ERPNEXT-PROJECT/deploy/nginx/asset-ui-security-headers.conf;
		add_header Cache-Control "no-cache" always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss://$host; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
		try_files $uri $uri/ @asset_ui_index;
	}

	location @asset_ui_index {
		rewrite ^ /asset-ui/index.html last;
	}

	location /assets {
		include /Users/bijanzarefar/ERPNEXT-PROJECT/deploy/nginx/asset-ui-security-headers.conf;
		add_header Cache-Control "max-age=31536000" always;
		try_files $uri =404;
	}

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name asset.localhost;
		proxy_set_header Host $host;
		proxy_pass http://asset_frappe_local;
	}

	location / {
		location ~* ^/files/.*\.(svgz?|html?|xht(ml)?|shtml?|mht(ml)?|xml|xslt?|swf)$ {
			include /Users/bijanzarefar/ERPNEXT-PROJECT/deploy/nginx/asset-ui-security-headers.conf;
			add_header Content-Disposition "attachment" always;
			add_header Content-Security-Policy "sandbox" always;
			default_type application/octet-stream;
			types { }
			try_files /asset.localhost/public/$uri @frappe;
		}
		try_files /asset.localhost/public/$uri @frappe;
	}

	location @frappe {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Frappe-Site-Name asset.localhost;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;
		proxy_pass http://asset_frappe_local;
	}
}
